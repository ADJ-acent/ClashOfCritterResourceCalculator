name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

      # The page is loaded over file:// as plain script and link tags, which is
      # what keeps it working from a folder as well as from the web. A build
      # step, a bundler import or a module script would break that quietly, so
      # the shape of index.html is checked rather than trusted.
      - name: The page still runs with no build step
        run: |
          if grep -qE '<script[^>]+type="module"' index.html; then
            echo "::error::index.html loads a module script, which file:// blocks."
            exit 1
          fi
          for f in data.js machine.js app.js styles.css; do
            grep -q "$f" index.html || { echo "::error::index.html no longer loads $f"; exit 1; }
          done
